name: Test and publish Docker images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Type-checks the whole frontend, then builds it.
      - run: npm run build

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Tauri build expects the compiled frontend in dist/.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  images:
    needs: [server-tests, web-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: web
            context: .
            dockerfile: ./Dockerfile
          - component: api
            context: ./server
            dockerfile: ./server/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/dbrepairs-${{ matrix.component }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=DBRepairs ${{ matrix.component }}
            org.opencontainers.image.description=DBRepairs Server ${{ matrix.component }} image
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Pull requests only build the images (to prove they still build); main publishes them.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && format('dbrepairs-{0}:ci', matrix.component) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Check nginx configuration
        if: matrix.component == 'web' && github.event_name == 'pull_request'
        run: docker run --rm --add-host api:127.0.0.1 dbrepairs-web:ci /docker-entrypoint.sh nginx -t

      # Runs the real web image next to a stand-in API and checks which requests nginx forwards.
      - name: Check nginx routing
        if: matrix.component == 'web' && github.event_name == 'pull_request'
        run: |
          docker network create ci
          docker run -d --name api --network ci python:3-alpine sh -c \
            'mkdir -p /srv/api/app && printf from-api > /srv/api/app/icon-192.png && cd /srv && python -m http.server 3000'
          docker run -d --name web --network ci -p 8080:8080 dbrepairs-web:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          # App icons live under /api/ and end in .png; they must reach the API, not the static-file rule.
          test "$(curl -s http://127.0.0.1:8080/api/app/icon-192.png)" = "from-api"
          # Bundled files are still served by nginx itself.
          curl -sf -o /dev/null http://127.0.0.1:8080/icons/icon-192.png
          # The service worker must never be cached, or installed apps miss updates.
          curl -sfI http://127.0.0.1:8080/sw.js | grep -i "cache-control: no-cache"
          echo "nginx routing OK"
