server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 256m;

  # Security headers. nginx drops these inside any location that sets its own
  # add_header, so the static-asset location below repeats them.
  set $csp "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://${API_HOST}:${API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Send only the real client address so it cannot be spoofed to dodge the login limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    # The app page itself must never be cached long, or phones keep an old version.
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    try_files $uri $uri/ /index.html;
  }

  # The service worker must be re-checked on every visit so updates reach installed apps.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|webp|ico|svg)$ {
    expires 7d;
    add_header Cache-Control "public, no-transform";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    try_files $uri =404;
  }
}
