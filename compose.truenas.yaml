# DBRepairs for TrueNAS SCALE 25.10
# Create these datasets first:
#   Apps/dbrepairs-postgres -> /mnt/Apps/dbrepairs-postgres
#   Apps/dbrepairs-backups  -> /mnt/Apps/dbrepairs-backups
#   Apps/dbrepairs-photos   -> /mnt/Apps/dbrepairs-photos (owned by uid 1000)
# Replace the three passwords below before installing. Use a different long,
# random value for each. DBRepairs refuses to start while they still say CHANGE-THIS.

# Database administrator. Only the one-time db-init step uses it.
x-admin-password: &admin-password "CHANGE-THIS-ADMIN-PASSWORD"
# Restricted database account used by the application and the backups.
x-app-db-password: &app-db-password "CHANGE-THIS-APP-PASSWORD"
# The password people type to sign in to DBRepairs in the browser.
x-login-password: &login-password "CHANGE-THIS-LOGIN-PASSWORD"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbrepairs
      POSTGRES_USER: dbrepairs
      POSTGRES_PASSWORD: *admin-password
      TZ: Europe/Lisbon
    volumes:
      - /mnt/Apps/dbrepairs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbrepairs -d dbrepairs"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Runs once at every start: creates the restricted database account the app
  # uses, so a restored backup can never run commands as the database superuser.
  db-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: dbrepairs
      PGUSER: dbrepairs
      PGPASSWORD: *admin-password
      APP_DB_USER: dbrepairs_app
      APP_DB_PASSWORD: *app-db-password
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        psql -v ON_ERROR_STOP=1 -v app_user="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'app_user') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'app_user', :'app_password') \gexec
        SELECT format('ALTER DATABASE %I OWNER TO %I', current_database(), :'app_user') \gexec
        SELECT format('ALTER SCHEMA public OWNER TO %I', :'app_user') \gexec
        SELECT format('ALTER TABLE public.%I OWNER TO %I', tablename, :'app_user') FROM pg_tables WHERE schemaname = 'public' \gexec
        SQL
    networks: [internal]

  api:
    # Built from your fork by .github/workflows/docker-publish.yml.
    # To update, change the version number on both image lines.
    image: ghcr.io/egod21/dbrepairs-api:0.6.0
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: dbrepairs
      PGUSER: dbrepairs_app
      PGPASSWORD: *app-db-password
      DBREPAIRS_PASSWORD: *login-password
      DATABASE_POOL_SIZE: 10
      TZ: Europe/Lisbon
      TRUST_PROXY: "true"
      PHOTOS_DIR: /data/photos
      # Optional: a long random value turns on the encrypted password vault. Never change it afterwards.
      VAULT_KEY: ""
    volumes:
      - /mnt/Apps/dbrepairs-photos:/data/photos
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [internal]

  web:
    image: ghcr.io/egod21/dbrepairs-web:0.6.0
    restart: unless-stopped
    ports:
      - "31500:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: dbrepairs
      PGUSER: dbrepairs_app
      PGPASSWORD: *app-db-password
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 14
      TZ: Europe/Lisbon
    volumes:
      - /mnt/Apps/dbrepairs-backups:/backups
    depends_on:
      api:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          temporary="/backups/DBRepairs-$${stamp}.dump.tmp"
          destination="/backups/DBRepairs-$${stamp}.dump"
          if pg_dump --format=custom --no-owner --no-privileges --file="$$temporary"; then
            mv "$$temporary" "$$destination"
            find /backups -type f -name 'DBRepairs-*.dump' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          else
            rm -f "$$temporary"
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    networks: [internal]

networks:
  internal:
